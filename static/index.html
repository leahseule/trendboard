<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendBoard — AI/개발 트렌드 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="primary-nav">
  <a href="index.html" class="primary-nav-item active">카드</a>
  <a href="trend.html" class="primary-nav-item">히스토리</a>
  <a href="/logout" class="logout-link">로그아웃</a>
</nav>

<header class="topbar">
  <h1>TrendBoard</h1>
  <div class="date-bar">
    <div class="tabs" id="daysFilter">
      <button class="tab" data-days="1">1일</button>
      <button class="tab" data-days="2">2일</button>
      <button class="tab active" data-days="3">3일</button>
    </div>
    <button id="refreshBtn" class="refresh-btn" type="button">
      <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      새로고침
    </button>
  </div>
</header>

<div class="trendbar" id="trendbar">
  <div class="tabs" id="sourceTabs">
    <button class="tab active" data-source="all">전체</button>
    <button class="tab" data-source="aitimes">AI타임스</button>
    <button class="tab" data-source="naver_it">네이버 IT</button>
    <button class="tab" data-source="geeknews">GeekNews</button>
  </div>
  <button id="trendBtn" disabled>
    <span id="trendCount" class="cart-count hidden">0</span>
    선택 항목 인사이트 분석
  </button>
</div>

<main id="cards" class="cards"></main>

<div class="modal-overlay hidden" id="methodModalOverlay">
  <div class="modal">
    <button class="modal-close" id="methodModalClose" aria-label="닫기">×</button>
    <h2 class="modal-title">어떤 방식으로 분석할까요?</h2>
    <p class="modal-sub"><span id="methodModalCount">0</span>개 글을 분석합니다.</p>
    <div class="method-options">
      <button class="method-option" id="methodChatGptBtn">
        <span class="method-name">ChatGPT로</span>
        <span class="method-desc">내 ChatGPT 계정에서 무료로 분석해요. 분석 결과는 ChatGPT에서만 확인해요 — 어떤 글을 골랐는지만 히스토리에 남아요.</span>
      </button>
      <button class="method-option" id="methodClaudeBtn">
        <span class="method-name">Claude로</span>
        <span class="method-desc">내 Claude 계정에서 무료로 분석해요(결과를 마크다운 아티팩트로 만들어달라고 같이 요청해요). 분석 결과는 Claude에서만 확인해요 — 어떤 글을 골랐는지만 히스토리에 남아요.</span>
      </button>
    </div>
    <button class="method-copy-link" id="methodCopyLinkBtn">링크가 안 열리면 여기를 눌러 프롬프트 복사</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
