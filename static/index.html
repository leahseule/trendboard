<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrendBoard — AI/개발 트렌드 대시보드</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav class="primary-nav">
  <a href="index.html" class="primary-nav-item active">카드</a>
  <a href="trend.html" class="primary-nav-item">히스토리</a>
</nav>

<header class="topbar">
  <h1>TrendBoard</h1>
  <p class="subtitle">GeekNews · AI타임스 · 네이버 IT에서 AI/개발 최신 글을 모아 요약합니다</p>
  <div class="date-bar">
    <span class="date-bar-label">기간 검색</span>
    <input type="date" id="dateFrom">
    <span class="date-sep">~</span>
    <input type="date" id="dateTo">
    <button id="dateSearchBtn">검색</button>
    <button id="dateResetBtn" class="date-reset hidden">최근 3일로</button>
    <span id="dateStatus" class="date-status">최근 3일 보는 중</span>
    <button id="refreshBtn" title="새로고침">새로고침</button>
  </div>
</header>

<div class="trendbar" id="trendbar">
  <div class="tabs" id="sourceTabs">
    <button class="tab active" data-source="all">전체</button>
    <button class="tab" data-source="aitimes">AI타임스</button>
    <button class="tab" data-source="naver_it">네이버 IT</button>
    <button class="tab" data-source="geeknews">GeekNews</button>
  </div>
  <button id="trendBtn" disabled>
    <span id="trendCount" class="cart-count hidden">0</span>
    선택 항목 트렌드 분석
  </button>
</div>

<main id="cards" class="cards"></main>

<div class="modal-overlay hidden" id="methodModalOverlay">
  <div class="modal">
    <button class="modal-close" id="methodModalClose" aria-label="닫기">×</button>
    <h2 class="modal-title">어떤 방식으로 분석할까요?</h2>
    <p class="modal-sub"><span id="methodModalCount">0</span>개 글을 분석합니다.</p>
    <div class="method-options">
      <button class="method-option" id="methodTrendboardBtn">
        <span class="method-name">TrendBoard</span>
        <span class="method-desc">이 앱이 OpenAI API로 바로 분석해요. 비용이 발생하고, 결과가 히스토리에 저장돼요.</span>
      </button>
      <button class="method-option" id="methodChatGptBtn">
        <span class="method-name">ChatGPT로</span>
        <span class="method-desc">내 ChatGPT 계정에서 무료로 분석해요. 결과는 ChatGPT에서만 확인하고, 이 앱에는 저장되지 않아요.</span>
      </button>
      <button class="method-option" id="methodClaudeBtn">
        <span class="method-name">Claude로</span>
        <span class="method-desc">내 Claude 계정에서 무료로 분석해요. 결과는 Claude에서만 확인하고, 이 앱에는 저장되지 않아요.</span>
      </button>
    </div>
    <button class="method-copy-link" id="methodCopyLinkBtn">링크가 안 열리면 여기를 눌러 프롬프트 복사</button>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="common.js"></script>
<script src="app.js"></script>
</body>
</html>
