<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>회원가입 — TrendBoard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-shell">
  <form class="auth-card" method="post" action="/api/register">
    <h1 class="auth-title">TrendBoard</h1>
    <p class="auth-error hidden" id="authError"></p>
    <label class="auth-label">아이디
      <input class="auth-input" type="text" name="username" autocomplete="username" required autofocus>
    </label>
    <label class="auth-label">비밀번호 (8자 이상)
      <input class="auth-input" type="password" name="password" autocomplete="new-password" required minlength="8">
    </label>
    <label class="auth-label">비밀번호 확인
      <input class="auth-input" type="password" name="confirm" autocomplete="new-password" required minlength="8">
    </label>
    <button class="auth-submit" type="submit">회원가입</button>
    <a class="auth-switch" href="login.html">이미 계정이 있으신가요? 로그인</a>
  </form>
</div>
<script>
  const err = new URLSearchParams(location.search).get("error");
  const messages = {
    missing: "아이디와 비밀번호를 입력해주세요.",
    mismatch: "비밀번호가 서로 달라요.",
    short: "비밀번호는 8자 이상으로 해주세요.",
    taken: "이미 있는 아이디예요.",
  };
  if (err) {
    const el = document.getElementById("authError");
    el.textContent = messages[err] || "회원가입에 실패했습니다.";
    el.classList.remove("hidden");
  }
</script>
</body>
</html>
